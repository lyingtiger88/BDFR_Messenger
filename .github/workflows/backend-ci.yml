name: backend-ci

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore and build Gateway
        run: dotnet build Backend/BDFR.Gateway/BDFR.Gateway.csproj -c Release
      - name: Restore and build Auth
        run: dotnet build Backend/BDFR.Auth/BDFR.Auth.csproj -c Release
      - name: Restore and build Security
        run: dotnet build Backend/BDFR.Security/BDFR.Security.csproj -c Release
      - name: Restore and build Database
        run: dotnet build Backend/BDFR.Database/BDFR.Database.csproj -c Release
