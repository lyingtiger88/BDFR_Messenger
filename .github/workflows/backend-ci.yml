name: backend-ci

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build Gateway
        run: dotnet build Backend/BDFR.Gateway/BDFR.Gateway.csproj -c Release
      - name: Run tests
        run: dotnet test Backend/BDFR.Tests/BDFR.Tests.csproj -c Release
      - name: Validate Docker build
        run: docker build -f Backend/BDFR.Gateway/Dockerfile .
