services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bdfr_messenger
      POSTGRES_USER: bdfr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - bdfr-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - bdfr-redis:/data

volumes:
  bdfr-postgres:
  bdfr-redis:
